<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>RIFT Dashboard</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:#FAFAF8;color:#1A1A1A;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:#D64040;color:#fff}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,64,64,.5)}50%{box-shadow:0 0 0 12px rgba(214,64,64,0)}}
@keyframes glow{0%,100%{text-shadow:0 0 6px rgba(214,64,64,.3)}50%{text-shadow:0 0 20px rgba(214,64,64,.6)}}
@keyframes scanLine{0%{top:-10%}100%{top:110%}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes blink{50%{border-color:transparent}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-2px)}20%,40%,60%,80%{transform:translateX(2px)}}
@keyframes ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(4);opacity:0}}
@keyframes gridPulse{0%,100%{opacity:.03}50%{opacity:.08}}
@keyframes stepGlow{0%{box-shadow:0 0 0 0 rgba(214,64,64,.4)}50%{box-shadow:0 0 30px 4px rgba(214,64,64,.15)}100%{box-shadow:0 0 0 0 rgba(214,64,64,0)}}
@keyframes countUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;border-bottom:3px solid #1A1A1A;background:#FFFFFF;position:relative;z-index:10}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px;text-decoration:none;color:#1A1A1A}
.logo span{color:#D64040}
.nav{display:flex;gap:8px}
.nav a{padding:8px 16px;border:2px solid #1A1A1A;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;text-decoration:none;color:#1A1A1A;transition:all .15s ease}
.nav a:hover{box-shadow:3px 3px 0 #1A1A1A;transform:translate(-2px,-2px);background:#F0F0EE}
.nav a.active{background:#1A1A1A;color:#fff}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(#1A1A1A 1px,transparent 1px),linear-gradient(90deg,#1A1A1A 1px,transparent 1px);background-size:60px 60px;opacity:.04;animation:gridPulse 8s ease-in-out infinite}
.hero-dots{position:absolute;inset:0}
.hero-dot{position:absolute;width:4px;height:4px;background:#D64040;border-radius:50%;opacity:.15;animation:float 6s ease-in-out infinite}
.hero-inner{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:80px 40px;width:100%}
.hero-text{animation:fadeUp .8s ease-out forwards;width:100%}
.hero h1{font-size:240px !important;font-weight:900;line-height:1.0;letter-spacing:-10px;margin-bottom:28px}
.hero h1 .line{display:block;overflow:visible}
.hero h1 .line span{display:inline-block;animation:fadeUp .6s ease-out forwards}
.hero h1 .line:nth-child(2) span{animation-delay:.15s}
.hero h1 .line:nth-child(3) span{animation-delay:.3s}
.hero h1 em{font-style:normal !important;color:#D64040 !important;position:relative}
.hero h1 em::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:4px;background:#D64040;transform:scaleX(0);transform-origin:left;animation:scaleIn .4s ease-out .8s forwards}
.hero p{font-size:19px;line-height:1.7;color:#999999;margin-bottom:36px;max-width:500px;animation:fadeUp .6s ease-out .3s forwards;opacity:0}
.hero-btns{display:flex;gap:14px;animation:fadeUp .6s ease-out .45s forwards;opacity:0}
.btn{padding:16px 32px;font-family:inherit;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;text-decoration:none;display:inline-block;border:3px solid #1A1A1A;transition:all .15s ease;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:#1A1A1A;transform:scaleX(0);transform-origin:left;transition:transform .2s ease;z-index:0}
.btn span{position:relative;z-index:1}
.btn-fill{background:#1A1A1A;color:#fff;box-shadow:5px 5px 0 #1A1A1A}
.btn-fill:hover{box-shadow:8px 8px 0 #1A1A1A;transform:translate(-3px,-3px)}
.btn-ghost{background:transparent;color:#1A1A1A;box-shadow:5px 5px 0 #1A1A1A}
.btn-ghost:hover{box-shadow:8px 8px 0 #1A1A1A;transform:translate(-3px,-3px)}
.demo{border:3px solid #1A1A1A;box-shadow:10px 10px 0 #1A1A1A;background:#FFFFFF;display:flex;flex-direction:column;max-width:600px}
.demo-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:3px solid #1A1A1A;background:#F0F0EE}
.demo-header h3{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:2px}
.demo-dots{display:flex;gap:5px}
.demo-dot{width:10px;height:10px;border-radius:50%;border:2px solid #1A1A1A;transition:all .4s cubic-bezier(.4,0,.2,1)}
.demo-dot.done{background:#1A1A1A;border-color:#1A1A1A;transform:scale(1.1)}
.demo-dot.active{background:#D64040;border-color:#D64040;animation:pulse 2s infinite;transform:scale(1.2)}
.demo-content{padding:28px 24px;min-height:360px;position:relative;overflow:hidden}
.step-card{animation:fadeUp .35s cubic-bezier(.4,0,.2,1) forwards}
.step-num{font-size:64px;font-weight:900;color:#F0F0EE;line-height:1;margin-bottom:4px;animation:countUp .3s ease-out forwards}
.step-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:3px;margin-bottom:8px}
.step-title.t-fail,.step-title.t-rift,.step-title.t-diagnose{color:#D64040}
.step-title.t-fix,.step-title.t-verify,.step-title.t-resolve{color:#2D8A4E}
.step-title.t-capture,.step-title.t-freeze,.step-title.t-reconstruct{color:#1A1A1A}
.step-text{font-size:14px;line-height:1.7;color:#1A1A1A;margin-bottom:18px}
.step-detail{font-family:'JetBrains Mono',monospace;font-size:11px;padding:16px 18px;border:2px solid #1A1A1A;background:#F0F0EE;line-height:1.9;animation:scaleIn .3s ease-out .1s forwards;opacity:0;position:relative}
.step-detail::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:#D64040}
.step-detail .k{color:#999999}
.step-detail .v{color:#1A1A1A;font-weight:600}
.step-detail .err{color:#D64040;font-weight:700}
.step-detail .ok{color:#2D8A4E;font-weight:700}
.demo-footer{display:flex;border-top:3px solid #1A1A1A}
.demo-footer button{flex:1;padding:14px;font-family:inherit;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;border:none;border-right:3px solid #1A1A1A;cursor:pointer;background:transparent;transition:all .15s ease}
.demo-footer button:last-child{border-right:none}
.demo-footer button:hover{background:#1A1A1A;color:#fff}
.demo-footer button:active{transform:scale(.97)}
.demo-footer button:disabled{opacity:.2;cursor:default;transform:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.section{padding:100px 0}
.sec-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:#999999;margin-bottom:8px}
.section h2{font-size:38px;font-weight:900;letter-spacing:-1px;margin-bottom:16px}
.section h2 em{font-style:normal;color:#D64040}
.section .sub{font-size:16px;color:#999999;line-height:1.7;max-width:540px;margin-bottom:40px}
.loop{display:flex;flex-wrap:wrap;gap:0;position:relative}
.ls{flex:1;min-width:100px;padding:18px 14px;border:3px solid #1A1A1A;margin-right:-3px;margin-bottom:-3px;transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;background:#FFFFFF}
.ls:last-child{margin-right:0}
.ls:hover{background:#1A1A1A;color:#fff;z-index:2;transform:translateY(-4px);box-shadow:0 8px 0 #1A1A1A}
.ls:hover small{color:rgba(255,255,255,.6)}
.ls:hover .ls-arrow{color:rgba(255,255,255,.4)}
.ls strong{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.ls small{font-size:10px;color:#999999;display:block}
.ls-arrow{position:absolute;right:-8px;top:50%;transform:translateY(-50%);font-size:14px;color:#999999;z-index:3;transition:color .2s}
.ls:last-child .ls-arrow{display:none}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border:3px solid #1A1A1A;box-shadow:5px 5px 0 #1A1A1A;padding:28px;background:#FFFFFF;transition:all .25s cubic-bezier(.4,0,.2,1)}
.card:hover{box-shadow:8px 8px 0 #1A1A1A;transform:translate(-3px,-3px)}
.card-n{font-size:48px;font-weight:900;color:#F0F0EE;line-height:1;margin-bottom:8px;transition:color .2s}
.card:hover .card-n{color:#D6404030}
.card h3{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.card p{font-size:12px;line-height:1.7;color:#999999}
.proof{border:3px solid #1A1A1A;box-shadow:5px 5px 0 #1A1A1A;background:#FFFFFF}
.proof-grid{display:grid;grid-template-columns:repeat(3,1fr)}
.proof-item{padding:28px;border:2px solid #1A1A1A;margin:-2px;text-align:center;transition:all .2s}
.proof-item:hover{background:#1A1A1A;color:#fff}
.proof-item:hover small{color:rgba(255,255,255,.6)}
.proof-item strong{display:block;font-size:28px;font-weight:900;margin-bottom:4px}
.proof-item small{font-size:9px;color:#999999;text-transform:uppercase;letter-spacing:1.5px}
.dash{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.sidebar{border-right:3px solid #1A1A1A;background:#FFFFFF;display:flex;flex-direction:column}
.sb-logo{padding:20px 24px;border-bottom:3px solid #1A1A1A}
.sb-logo a{font-size:18px;font-weight:900;text-decoration:none;color:#1A1A1A}
.sb-logo a span{color:#D64040}
.sb-sec{padding:16px 20px}
.sb-sec h4{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:#999999;margin-bottom:10px}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border:2px solid transparent;font-size:11px;font-weight:600;cursor:pointer;margin-bottom:3px;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:0;text-align:left;width:100%;background:none;font-family:inherit;color:#1A1A1A}
.sb-item:hover{border-color:#1A1A1A;box-shadow:3px 3px 0 #1A1A1A;transform:translate(-2px,-2px);background:#F0F0EE}
.sb-item.on{border:2px solid #1A1A1A;background:#1A1A1A;color:#fff;box-shadow:3px 3px 0 #1A1A1A}
.sb-item.on .sb-meta{color:rgba(255,255,255,.5)}
.sb-dot{width:8px;height:8px;border:2px solid #1A1A1A;flex-shrink:0}
.sb-dot.ok{background:#2D8A4E}
.sb-dot.err{background:#D64040}
.sb-dot.warn{background:#E8A838}
.sb-meta{font-size:9px;color:#999999}
.main{overflow-y:auto;padding:32px 40px;background:#FAFAF8}
.m-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.m-top h2{font-size:22px;font-weight:900;letter-spacing:-1px}
.m-stats{display:flex;gap:8px}
.m-stat{padding:6px 14px;border:2px solid #1A1A1A;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;background:#FFFFFF}
.m-stat em{font-style:normal;color:#D64040}
.panel{border:3px solid #1A1A1A;box-shadow:6px 6px 0 #1A1A1A;background:#FFFFFF;margin-bottom:18px;animation:fadeUp .4s ease-out forwards;transition:all .2s}
.panel:hover{box-shadow:8px 8px 0 #1A1A1A;transform:translate(-1px,-1px)}
.panel:nth-child(2){animation-delay:.06s}
.panel:nth-child(3){animation-delay:.12s}
.panel:nth-child(4){animation-delay:.18s}
.panel:nth-child(5){animation-delay:.24s}
.panel:nth-child(6){animation-delay:.3s}
.p-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:3px solid #1A1A1A}
.p-head h3{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:2px}
.p-badge{padding:4px 12px;border:2px solid;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.p-badge.ok{background:#2D8A4E;color:#fff;border-color:#2D8A4E}
.p-badge.err{background:#D64040;color:#fff;border-color:#D64040}
.p-badge.info{background:#1A1A1A;color:#fff;border-color:#1A1A1A}
.p-body{padding:18px 20px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0F0EE;transition:background .15s}
.kv:last-child{border-bottom:none}
.kv:hover{background:#F0F0EE;margin:0 -20px;padding:10px 20px}
.kv .k{font-size:10px;font-weight:700;color:#999999;text-transform:uppercase;letter-spacing:1px}
.kv .v{font-size:11px;font-weight:600;text-align:right;max-width:60%;word-break:break-all}
.hash-box{display:flex;align-items:center;gap:8px;padding:10px 14px;border:2px solid #1A1A1A;margin:6px 0;background:#F0F0EE;transition:all .15s}
.hash-box:hover{border-color:#D64040}
.hash-box .hl{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#999999}
.hash-box .hv{font-family:'JetBrains Mono',monospace;font-size:10px;flex:1;word-break:break-all}
.hash-box .hc{padding:4px 10px;font-family:inherit;font-size:8px;font-weight:800;border:2px solid #1A1A1A;background:transparent;cursor:pointer;text-transform:uppercase;transition:all .15s}
.hash-box .hc:hover{background:#1A1A1A;color:#fff}
.pipeline{display:flex;margin-bottom:18px;position:relative}
.pipeline::after{content:'';position:absolute;bottom:-9px;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#1A1A1A 0,#1A1A1A 6px,transparent 6px,transparent 12px)}
.pipeline .ps{flex:1;padding:10px 6px;border:3px solid #1A1A1A;text-align:center;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-right:-3px;transition:all .3s cubic-bezier(.4,0,.2,1);background:#FFFFFF;position:relative}
.pipeline .ps:last-child{margin-right:0}
.pipeline .ps.done{background:#1A1A1A;color:#fff;border-color:#1A1A1A;transform:translateY(-2px)}
.pipeline .ps.now{background:#D64040;color:#fff;border-color:#D64040;animation:stepGlow 2s infinite;transform:translateY(-3px)}
.pipeline .ps.wait{color:#999999;background:#F0F0EE}
.export-box{font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.7;padding:16px;border:2px solid #1A1A1A;background:#F0F0EE;max-height:200px;overflow-y:auto;white-space:pre-wrap}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px;text-align:center}
.empty h3{font-size:18px;font-weight:800;margin-bottom:8px}
.empty p{font-size:12px;color:#999999}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.15}
.scan{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9999}
.scan::after{content:'';position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#D6404030,transparent);animation:scanLine 5s linear infinite;opacity:.6}
.grain{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9998;opacity:.012}
.scenarios{display:flex;gap:0;border:3px solid #1A1A1A;margin-bottom:-3px;position:relative;z-index:2}
.sc-btn{flex:1;padding:10px;font-family:inherit;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;border:none;border-right:3px solid #1A1A1A;cursor:pointer;background:#FFFFFF;color:#1A1A1A;transition:all .15s}
.sc-btn:last-child{border-right:none}
.sc-btn:hover{background:#F0F0EE}
.sc-btn.active{background:#1A1A1A;color:#fff}
.sc-label{font-size:9px;font-weight:700;color:#999999;text-transform:uppercase;letter-spacing:1px;padding:6px 0;margin-bottom:4px}
.export-btn{display:block;width:100%;margin-top:16px;padding:14px;font-family:inherit;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:2px;border:3px solid #1A1A1A;background:#1A1A1A;color:#fff;cursor:pointer;transition:all .15s;box-shadow:5px 5px 0 #1A1A1A}
.export-btn:hover{box-shadow:8px 8px 0 #1A1A1A;transform:translate(-3px,-3px);background:#D64040}
@media(max-width:900px){.hero h1{font-size:48px}.cards{grid-template-columns:1fr}.dash{grid-template-columns:1fr}.sidebar{display:none}.loop{flex-direction:column}.ls{margin-right:0}}

\n'+'## FIX\n\n'+'Agent version: v1.1\n'+'Verdict: FIX_VERIFIED\n\n'+'## VERIFICATION\n\n'+'Fixed agent: PASSED\n'+'Original incident conditions: PRESERVED\n\n'+'## INTEGRITY\n\n'+'Frozen evidence tampering: NOT DETECTED\n\n'+'## RESOLUTION\n\n'+'INCIDENT RESOLVED\n\n'+'## RELEASE STATUS\n\n'+'PRODUCTION-SAFE\n'+'Release authorized: YES\n\n'+'---\n\n'+'*Generated by RIFT*\n';var blob=new Blob([md],{type:'text/markdown'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=inc.incident_id+'-evidence.md';a.click();}</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>DELTA LAB</title>
<style>body{font-family:monospace;background:#0a0a0a;color:#e8e8e8;max-width:980px;margin:32px auto;padding:0 20px}
h1{font-size:22px}.sub{color:#888}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{border:1px solid #333;border-radius:10px;padding:14px;min-height:180px}
.ok{color:#4ade80}.bad{color:#f87171}.warn{color:#fbbf24}.dim{color:#888}
button{background:#fff;color:#000;border:0;border-radius:8px;padding:10px 18px;font-family:monospace;font-size:15px;cursor:pointer;margin-right:8px}
#verdict{font-size:44px;font-weight:bold;text-align:center;margin:20px 0}
pre{white-space:pre-wrap}</style></head><body>
<h1>DELTA LAB — the side-effect firewall</h1>
<p class="sub">An agent commits not because it achieved the goal, but because every consequential change is accounted for.</p>
<button onclick="clean()">▶ 1 · clean refund</button>
<button onclick="attack()">▶ 2 · same refund + hidden mutation</button>
<div class="grid">
<div class="card"><b>USER INTENT</b><pre>Refund Alice $100</pre><b>AUTHORIZED EFFECTS</b><pre class="ok">✓ refund.created
✓ balance -100
✓ refund.succeeded</pre></div>
<div class="card"><b>OBSERVED</b><pre id="obs"><span class="dim">— press a scenario —</span></pre></div>
<div class="card"><b>EFFECT GRAPH</b><pre id="graph"><span class="dim">—</span></pre></div>
</div>
<div id="verdict"></div>
<script>
function clean(){
obs.innerHTML='<span class="ok">✓ refund.created\n✓ balance -100\n✓ refund.succeeded</span>';
graph.innerHTML='refund\n ├── balance\n ├── refund\n └── status ✓';
verdict('<span class="ok">COMMIT</span><div class="sub" style="font-size:14px">AUTHORIZED = OBSERVED</div>');}
function attack(){
obs.innerHTML='<span class="ok">✓ refund.created\n✓ balance -100\n✓ refund.succeeded</span>\n<span class="bad">✗ risk_score 21 → 91</span>';
graph.innerHTML='refund\n ├── balance ✓\n └── status ✓\n\nrisk_score\n └── NO AUTHORIZED PARENT ✗';
verdict('<span class="bad">BLOCKED</span><div class="sub" style="font-size:14px">1 UNACCOUNTED EFFECT · the goal succeeded, the commit didn\'t</div>');}
function verdict(h){document.getElementById('verdict').innerHTML=h;}
</script></body></html>
